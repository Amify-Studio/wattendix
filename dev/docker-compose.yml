# Local test Home Assistant with the integration mounted read-only.
#   docker compose -f dev/docker-compose.yml up -d
#   then open http://localhost:18124
name: wattendix-dev
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0
    container_name: wattendix-dev
    ports:
      - "18124:8123"
    volumes:
      - ./config:/config
      - ../custom_components/wattendix:/config/custom_components/wattendix:ro
    environment:
      TZ: Europe/Paris
    restart: "no"
